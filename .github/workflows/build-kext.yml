name: Build Tahoe SR-IOV kexts

on:
  workflow_dispatch:
  push:
    branches:
      - codex/tahoe-sriov-vf
    paths:
      - "NootedGreen/**"
      - "NootedGreen.xcodeproj/**"
      - "Lilu.kext/**"
      - "MacKernelSDK/**"
      - "tools/**"
      - ".github/workflows/build-kext.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Record Tahoe runner toolchain
        run: |
          sw_vers
          uname -m
          uname -r
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx clang --version

          PRODUCT_VERSION="$(sw_vers -productVersion)"
          HOST_ARCH="$(uname -m)"
          DARWIN_VERSION="$(uname -r)"
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          case "$PRODUCT_VERSION" in 26.*) ;; *) echo "Expected macOS 26 runner, got $PRODUCT_VERSION" >&2; exit 1;; esac
          test "$HOST_ARCH" = x86_64 || { echo "Expected Intel runner, got $HOST_ARCH" >&2; exit 1; }
          case "$DARWIN_VERSION" in 25.*) ;; *) echo "Expected Darwin 25 for macOS 26, got $DARWIN_VERSION" >&2; exit 1;; esac
          case "$XCODE_VERSION" in 26.*) ;; *) echo "Expected Xcode 26, got $XCODE_VERSION" >&2; exit 1;; esac
          case "$SDK_VERSION" in 26.*) ;; *) echo "Expected macOS 26 SDK, got $SDK_VERSION" >&2; exit 1;; esac

      - name: Check all sources and protocol models
        run: |
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            CXX="$(xcrun --sdk macosx -f clang++)" \
            bash tools/check-static.sh

      - name: Build x86_64 release kext
        run: |
          xcodebuild \
            -project NootedGreen.xcodeproj \
            -scheme NootedGreen \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build x86_64 Metal smoke test
        run: |
          xcrun clang \
            -arch x86_64 \
            -mmacosx-version-min=13.0 \
            -fobjc-arc \
            tools/metal_smoke/main.m \
            -framework Foundation \
            -framework Metal \
            -framework VideoToolbox \
            -framework CoreMedia \
            -framework CoreVideo \
            -o "$RUNNER_TEMP/metal-smoke"

      - name: Stage artifact
        run: |
          KEXT_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release" -maxdepth 1 -name NootedGreen.kext -type d -print -quit)"
          test -n "$KEXT_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$KEXT_PATH" "$RUNNER_TEMP/NootedGreen-Tahoe-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NootedGreen-Tahoe-x86_64
          path: ${{ runner.temp }}/NootedGreen-Tahoe-x86_64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MetalSmoke-Tahoe-x86_64
          path: ${{ runner.temp }}/metal-smoke
          if-no-files-found: error
