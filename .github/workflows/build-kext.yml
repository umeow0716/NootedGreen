name: Build Tahoe SR-IOV kexts

on:
  workflow_dispatch:
  push:
    branches:
      - codex/tahoe-sriov-vf
    paths:
      - "NootedGreen/**"
      - "NootedGreen.xcodeproj/**"
      - "Lilu.kext/**"
      - "MacKernelSDK/**"
      - "tools/**"
      - ".github/workflows/build-kext.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check all sources and protocol models
        run: |
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            CXX="$(xcrun --sdk macosx -f clang++)" \
            bash tools/check-static.sh

      - name: Build x86_64 release kext
        run: |
          xcodebuild \
            -project NootedGreen.xcodeproj \
            -scheme NootedGreen \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build x86_64 Metal smoke test
        run: |
          xcrun clang \
            -arch x86_64 \
            -mmacosx-version-min=13.0 \
            -fobjc-arc \
            tools/metal_smoke/main.m \
            -framework Foundation \
            -framework Metal \
            -framework VideoToolbox \
            -framework CoreMedia \
            -framework CoreVideo \
            -o "$RUNNER_TEMP/metal-smoke"

      - name: Stage artifact
        run: |
          KEXT_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release" -maxdepth 1 -name NootedGreen.kext -type d -print -quit)"
          test -n "$KEXT_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$KEXT_PATH" "$RUNNER_TEMP/NootedGreen-Tahoe-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: NootedGreen-Tahoe-x86_64
          path: ${{ runner.temp }}/NootedGreen-Tahoe-x86_64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MetalSmoke-Tahoe-x86_64
          path: ${{ runner.temp }}/metal-smoke
          if-no-files-found: error
